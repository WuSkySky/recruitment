world_name: default
control_zone:
  bounds: [-1.5, 1.5, -1.5, 1.5]
robots:
  # Red start zone: x in [-6.0, -4.5], y in [2.0, 4.0].
  # Both robots are centered on the 1.5 m short side (x = -5.25) and
  # arranged front-to-back on the 2.0 m long side.
  - name: red_infantry_robot
    type: pb2025_infantry_robot
    color: red
    referee:
      max_hp: 350
      heat_limit: 88.0
      cooling_rate: 24.0
    pose:
      x: -5.25
      y: 2.5
      z: 0.1
      yaw: -1.5707963267948966
  - name: red_sentry_robot
    type: pb2025_sentry_robot
    color: red
    referee:
      max_hp: 400
      heat_limit: 260.0
      cooling_rate: 30.0
    pose:
      x: -5.25
      y: 3.5
      z: 0.1
      yaw: -1.5707963267948966

  # Blue start zone is the point-symmetric counterpart of the red zone.
  - name: blue_infantry_robot
    type: pb2025_infantry_robot
    color: blue
    referee:
      max_hp: 350
      heat_limit: 88.0
      cooling_rate: 24.0
    pose:
      x: 5.25
      y: -2.5
      z: 0.1
      yaw: 1.5707963267948966
  - name: blue_sentry_robot
    type: pb2025_sentry_robot
    color: blue
    referee:
      max_hp: 400
      heat_limit: 260.0
      cooling_rate: 30.0
    pose:
      x: 5.25
      y: -3.5
      z: 0.1
      yaw: 1.5707963267948966
